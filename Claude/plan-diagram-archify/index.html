<title>{Plan title}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* Layout: slim drafting-sheet header (plan title + type tabs), one diagram filling the rest */
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --fg: #1b2430;
    --muted: #5d6b7a;
    --line: #d5dce3;
    --accent: #2f5d8a;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --surface: #171e26; --fg: #e3e8ee; --muted: #93a1b0; --line: #2a3542; --accent: #7fb0e0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --surface: #171e26; --fg: #e3e8ee; --muted: #93a1b0; --line: #2a3542; --accent: #7fb0e0;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
    padding-block: 12px 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0 0 10px;
    font-size: 1rem;
    font-weight: 600;
    text-wrap: balance;
    min-width: 0;
  }
  [role="tablist"] { display: flex; flex-wrap: wrap; gap: 4px; }
  [role="tab"] {
    font: 500 0.8rem/1 var(--font-mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 8px 10px 10px;
    cursor: pointer;
  }
  [role="tab"]:hover { color: var(--fg); }
  [role="tab"][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main { flex: 1; min-height: 0; display: flex; background: var(--surface); }
  iframe { flex: 1; width: 100%; height: 100%; border: 0; }
  .why {
    margin: 0 0 10px;
    font-size: 0.85rem;
    color: var(--muted);
    flex-basis: 100%;
  }
</style>

<header>
  <h1 id="plan-title">{Plan title}</h1>
  <div role="tablist" id="tabs" aria-label="Diagram type"></div>
  <p class="why" id="why"></p>
</header>
<main><iframe id="view" title="Diagram"></iframe></main>

<script>
  const TABS = [
    { type: "workflow", why: "{one line from the plan's Diagram table}" },
  ];

  const tablist = document.getElementById("tabs");
  const view = document.getElementById("view");
  const why = document.getElementById("why");

  function select(type) {
    const tab = TABS.find(t => t.type === type) || TABS[0];
    view.src = tab.type + ".html";
    view.title = tab.type + " diagram";
    why.textContent = tab.why;
    for (const btn of tablist.children) {
      btn.setAttribute("aria-selected", String(btn.dataset.type === tab.type));
    }
  }

  for (const t of TABS) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("role", "tab");
    btn.dataset.type = t.type;
    btn.textContent = t.type;
    btn.addEventListener("click", () => { history.replaceState(null, "", "#" + t.type); select(t.type); });
    tablist.appendChild(btn);
  }
  tablist.hidden = TABS.length < 2;
  select(location.hash.slice(1));
</script>
